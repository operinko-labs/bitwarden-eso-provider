name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          token: ${{ secrets.GH_COM_TOKEN }}

      - name: Login to Harbor
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: harbor.vaderrp.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Package and push chart
        run: |
          helm package charts/bitwarden-eso-provider
          CHART_PKG=$(ls bitwarden-eso-provider-*.tgz)
          helm push "$CHART_PKG" oci://harbor.vaderrp.com/operinko-labs
