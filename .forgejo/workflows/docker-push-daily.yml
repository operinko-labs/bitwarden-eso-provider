name: nightly and on.push docker builds

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "the name of the tag for the docker image"
        type: "string"
        required: true

  push:
    branches:
      - main
    paths:
      - docker/**

  schedule:
    - cron: '0 0 * * *'

env:
  REGISTRY: harbor.vaderrp.com
  IMAGE: operinko-labs/bweso

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Determine tag
        id: tag
        env:
          # dispatch input is free text; pass via env (quoted) rather than
          # interpolating into the script to avoid shell injection
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tags=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
            echo "tags=nightly ${LAST_TAG}" >> "$GITHUB_OUTPUT"
          else
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tags=latest sha-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tag list
        id: tags
        run: |
          TAGS=""
          for t in ${{ steps.tag.outputs.tags }}; do
            TAGS="${TAGS}${{ env.REGISTRY }}/${{ env.IMAGE }}:${t},"
          done
          echo "tags=${TAGS%,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      # sigstore/cosign-installer needs envsubst, which the runner image lacks.
      - name: Install cosign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Sign the pushed digest with the operinko-labs key (public half:
      # cosign.pub in homeops). Legacy .sig tag, no Rekor upload: Harbor shows
      # it as a signature.cosign accessory and nothing leaves the homelab.
      # Retry while scan-on-push answers 412 to the manifest read.
      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for i in $(seq 1 30); do
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
              --use-signing-config=false --new-bundle-format=false --tlog-upload=false \
              "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" && exit 0
            sleep 10
          done
          exit 1
