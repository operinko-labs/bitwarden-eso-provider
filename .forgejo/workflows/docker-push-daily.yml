name: nightly and on.push docker builds

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "the name of the tag for the docker image"
        type: "string"
        required: true

  push:
    branches:
      - main
    paths:
      - docker/**

  schedule:
    - cron: '0 0 * * *'

env:
  REGISTRY: harbor.vaderrp.com
  IMAGE: operinko-labs/bweso

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Determine tag
        id: tag
        env:
          # dispatch input is free text; pass via env (quoted) rather than
          # interpolating into the script to avoid shell injection
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tags=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
            echo "tags=nightly ${LAST_TAG}" >> "$GITHUB_OUTPUT"
          else
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tags=latest sha-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tag list
        id: tags
        run: |
          TAGS=""
          for t in ${{ steps.tag.outputs.tags }}; do
            TAGS="${TAGS}${{ env.REGISTRY }}/${{ env.IMAGE }}:${t},"
          done
          echo "tags=${TAGS%,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
