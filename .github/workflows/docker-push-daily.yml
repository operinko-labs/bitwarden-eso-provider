name: nightly and on.push docker builds

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "the name of the tag for the docker image"
        type: "string"
        required: true

  push:
    branches:
      - main
    paths:
      - docker/**

  schedule:
    - cron: '0 0 * * *'

env:
  REGISTRY: harbor.vaderrp.com
  IMAGE: operinko-labs/bweso

jobs:
  docker:
    runs-on: org-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Buildah/Podman
        run: |
          echo "BUILDAH_ISOLATION=chroot" >> $GITHUB_ENV
          sudo apt-get update
          sudo apt-get -y install buildah podman uidmap libcap2 libcap2-bin
          sudo setcap cap_setuid+eip /usr/bin/newuidmap
          sudo setcap cap_setgid+eip /usr/bin/newgidmap
          sudo chmod u-s /usr/bin/newuidmap
          sudo chmod u-s /usr/bin/newgidmap
          mkdir -p "$HOME/.docker"
          echo -e "[storage]\ndriver = \"vfs\"" | sudo tee /etc/containers/storage.conf > /dev/null

      - name: Log in to Harbor
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1.7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tags=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
            echo "tags=nightly ${LAST_TAG}" >> "$GITHUB_OUTPUT"
          else
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tags=latest sha-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
        with:
          image: ${{ env.IMAGE }}
          tags: ${{ steps.tag.outputs.tags }}
          containerfiles: docker/Dockerfile
          context: docker
          layers: true

      - name: Push image
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}